<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Картотека — тренажер аналітика</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
<main>
  <div class="top">
    <div class="brand"><span data-i18n="brand.name">КАРТОТЕКА</span><small data-i18n="brand.sub"></small></div>
    <div class="spacer"></div>
    <div class="stats">
      <span class="seg big" id="uiSeg" data-i18n-title="ui.title"><button data-ui="ua">УКР</button><button data-ui="en">ENG</button></span>
      <span class="chip" id="scoreChip" data-i18n-title="score.title">★ <b id="score">0</b></span>
      <span class="chip rank" id="rankChip" data-i18n-title="rank.title"><b id="rank"></b></span>
      <button class="iconbtn" id="soundBtn"></button>
      <button class="iconbtn" id="rainBtn"></button>
      <button class="btn exam-btn" id="examBtn" data-i18n="exam.btn" data-i18n-title="exam.btnTitle"></button>
    </div>
    <div class="lvlnav">
      <button id="prev" data-i18n-title="nav.prev">←</button>
      <button id="menuBtn" class="cur"></button>
      <button id="next" data-i18n-title="nav.next">→</button>
    </div>
  </div>
  <div class="progress"><i id="prog"></i></div>

  <div class="exambar" id="exambar">
    <b id="examTitle"></b><span class="spacer"></span>
    <span class="et" id="examTime">15:00</span>
    <button class="btn ghost" id="examSkip" data-i18n="exam.skip"></button>
    <button class="btn" id="examEnd" data-i18n="exam.end"></button>
  </div>

  <div>
    <h1 class="task" id="task"></h1>
    <p class="task-sub" data-i18n-html="task.sub"></p>
  </div>

  <div class="desk" id="desk"><canvas class="rain-cv" id="rain" aria-hidden="true"></canvas><span class="desk-label" data-i18n="desk.label"></span></div>

  <div class="mapwrap" id="mapwrap" hidden>
    <div class="map-h"><span data-i18n="map.title" style="font-weight:600;color:var(--ink);font-size:13px"></span><span data-i18n="map.legend"></span></div>
    <div id="map"></div>
  </div>

  <div class="editor" id="editor">
    <div class="editor-head"><span data-i18n="editor.head"></span><span class="seg" id="cmdSeg" data-i18n-title="cmd.title"><button data-cmd="ua">УКР</button><button data-cmd="en">ENG</button></span><span class="timer" id="timer" data-i18n-title="timer.title">0:00</span><span class="count" id="count">—</span></div>
    <div class="editor-body">
      <span class="prompt" id="promptLbl">ЗАПИТ&gt;</span>
      <div class="qwrap"><pre class="qhl" id="qhl" aria-hidden="true"></pre><input id="q" autocomplete="off" spellcheck="false"></div>
      <button class="btn" id="run" data-i18n="btn.run"></button>
    </div>
    <div class="feedback" id="fb"></div>
    <ul class="why" id="why"></ul>
  </div>
  <div class="tools">
    <button class="btn ghost" id="tip"></button>
    <button class="btn ghost" id="hint" data-i18n="btn.answer"></button>
    <button class="btn ghost" id="clear" data-i18n="btn.clear"></button>
  </div>
  <div class="hints" id="hints"></div>

  <details class="records" id="records" open>
    <summary><span style="color:var(--ink);font-weight:600;font-size:14px" data-i18n="records.title"></span> <span data-i18n="records.sub"></span></summary>
    <div class="rec-list" id="recList"></div>
  </details>
</main>

<aside>
  <div>
    <div class="lesson-n" id="lnum"></div>
    <h2 class="lesson-t" id="ltitle"></h2>
    <div class="lesson-part" id="lpart"></div>
  </div>
  <div class="syntax" id="lsyntax"></div>
  <div class="lesson-body" id="lbody"></div>
  <div class="ex-h" data-i18n="ex.h"></div>
  <div class="ex" id="lex"></div>
  <div class="cheat">
    <h4 data-i18n="cheat.h"></h4>
    <table id="cheatTbl"></table>
    <details class="dict"><summary data-i18n="dict.h"></summary><table id="dictTbl"></table></details>
  </div>
  <div class="credits-link"><span data-i18n="credits.text"></span> <button class="linkbtn" id="credBtn" data-i18n="credits.btn"></button></div>
</aside>
</div>

<div class="overlay" id="overlay">
  <div class="panel" id="panel"></div>
</div>

<div class="viewer" id="viewer">
  <button class="btn ghost vclose" id="vclose" data-i18n="view.close"></button>
  <div class="vbox" id="vbox"></div>
</div>

<div class="toasts" id="toasts"></div>

<script src="media/credits.js"></script>
<script src="js/i18n.js"></script>
<script src="js/query.js"></script>
<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
